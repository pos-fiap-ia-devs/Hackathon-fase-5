<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agente SDR Imobiliário{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.3/dist/htmx.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-slate-800 text-white px-6 py-3 flex gap-6 items-center">
        <span class="font-semibold">🏠 Horizonte SDR</span>
        <a href="/dashboard" class="text-sm hover:underline">Dashboard</a>
        <a href="/chat" class="text-sm hover:underline">Chat do lead</a>
    </nav>
    <main class="p-6 max-w-6xl mx-auto">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
